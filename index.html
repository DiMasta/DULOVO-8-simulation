<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DULOVO 8</title>
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
  <div class="home">
    <header class="hero">
      <h1>DULOVO 8</h1>
      <p>Построй и програмирай свой 8-битов компютър — ниво по ниво.</p>
    </header>

    <form class="name-form" id="name-form">
      <label for="name-input">Как се казваш?</label>
      <input type="text" id="name-input" placeholder="Твоето име" maxlength="30" required>
      <button class="button" type="submit">Запази</button>
    </form>

    <nav class="level-grid">
      <a class="level-tile" data-level="1" href="level-1.html">
        <span class="number">1</span><span>Адресите на паметта</span><span class="state"></span>
      </a>
      <a class="level-tile" data-level="2" href="level-2.html">
        <span class="number">2</span><span>Адресите в двоичен код</span><span class="state"></span>
      </a>
      <a class="level-tile" data-level="3" href="level-3.html">
        <span class="number">3</span><span>Двоичен код без подсказки</span><span class="state"></span>
      </a>
      <a class="level-tile" data-level="4" href="level-4.html">
        <span class="number">4</span><span>Рождената ти дата</span><span class="state"></span>
      </a>
      <a class="level-tile" data-level="5" href="level-5.html">
        <span class="number">5</span><span>OUT и STOP!</span><span class="state"></span>
      </a>
      <a class="level-tile" data-level="6" href="level-6.html">
        <span class="number">6</span><span>Букви с OUTC</span><span class="state"></span>
      </a>
      <span class="level-tile locked">
        <span class="number">7</span><span>Очаквай скоро</span><span class="state">🔒</span>
      </span>
    </nav>
  </div>

  <script src="js/progress.js?v=7"></script>
  <script>
    const nameInput = document.getElementById("name-input");
    nameInput.value = Progress.getName();

    document.getElementById("name-form").addEventListener("submit", (event) => {
      event.preventDefault();
      Progress.setName(nameInput.value.trim());
    });

    // Each level unlocks once the previous one is completed.
    document.querySelectorAll(".level-tile[data-level]").forEach((tile) => {
      const level = Number(tile.dataset.level);
      const unlocked = level === 1 || Progress.isCompleted(level - 1);
      const state = tile.querySelector(".state");
      if (Progress.isCompleted(level)) {
        state.textContent = "✔";
      } else if (!unlocked) {
        state.textContent = "🔒";
        tile.classList.add("locked");
        tile.removeAttribute("href");
      }
    });
  </script>
</body>
</html>
